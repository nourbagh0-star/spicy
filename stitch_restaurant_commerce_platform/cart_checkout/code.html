<header class="bg-tertiary/90 dark:bg-tertiary/90 fixed top-0 w-full z-50 backdrop-blur-md shadow-sm">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full">
<button class="text-on-tertiary-fixed-variant dark:text-on-tertiary-fixed-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center">

<h1 class="font-display-lg text-headline-md tracking-widest text-primary dark:text-primary-fixed-dim">Checkout</h1>

</div>
</header>
<main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-[1280px] mx-auto grid grid-cols-1 md:grid-cols-12 gap-lg md:gap-xl">

<div class="md:col-span-7 flex flex-col gap-lg">

<div class="glass-card rounded-xl p-md shadow-sm">
<div class="flex items-start gap-sm mb-md pb-md border-b border-outline-variant/30">
<span class="material-symbols-outlined text-primary mt-1">location_on</span>
<div class="flex-1">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-xs">Delivery Address</label>
<div class="flex items-center justify-between">
<p class="font-body-md text-body-md text-on-surface">123 Culinary Ave, Apt 4B<br/>New York, NY 10012</p>
<button class="font-label-md text-label-md text-primary hover:underline">Edit</button>
</div>
</div>
</div>
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-sm">Delivery Time</label>
<div class="flex gap-sm">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="delivery_time" type="radio"/>
<div class="rounded-lg border border-outline-variant p-sm text-center peer-checked:bg-primary peer-checked:border-primary peer-checked:text-on-primary hover:bg-surface-container-high transition-colors">
<span class="font-label-md text-label-md block mb-xs">ASAP</span>
<span class="font-label-sm text-label-sm opacity-80">30-45 min</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="delivery_time" type="radio"/>
<div class="rounded-lg border border-outline-variant p-sm text-center peer-checked:bg-primary peer-checked:border-primary peer-checked:text-on-primary hover:bg-surface-container-high transition-colors">
<span class="font-label-md text-label-md block mb-xs">Schedule</span>
<span class="font-label-sm text-label-sm opacity-80">Select Time</span>
</div>
</label>
</div>
</div>
</div>
</section>

<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg">Payment Method</h2>
<div class="glass-card rounded-xl p-md shadow-sm flex flex-col gap-sm">
<label class="flex items-center gap-md p-sm rounded-lg border border-outline-variant/50 hover:bg-surface-container-lowest cursor-pointer transition-colors">
<input checked="" class="text-primary focus:ring-primary h-5 w-5" name="payment_method" type="radio"/>
<span class="material-symbols-outlined text-on-surface-variant">credit_card</span>
<div class="flex-1">
<p class="font-body-md text-body-md">•••• 4242</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Expires 12/25</p>
</div>
</label>
<label class="flex items-center gap-md p-sm rounded-lg border border-outline-variant/50 hover:bg-surface-container-lowest cursor-pointer transition-colors">
<input class="text-primary focus:ring-primary h-5 w-5" name="payment_method" type="radio"/>
<span class="material-symbols-outlined text-on-surface-variant">account_balance_wallet</span>
<div class="flex-1">
<p class="font-body-md text-body-md">Apple Pay</p>
</div>
</label>
<button class="flex items-center gap-sm mt-sm text-primary font-label-md text-label-md hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]">add</span> Add new method
                    </button>
</div>

<span class="font-label-md text-label-md w-4 text-center">1</span>
<button class="material-symbols-outlined text-[16px] hover:text-primary">add</button>
</div>
</div>
</div>
</div>

<button class="material-symbols-outlined text-[16px] hover:text-primary">add</button>
</div>
</div>
</div>
</div>

</div>

<span>$5.99</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-on-surface-variant">

</div>
