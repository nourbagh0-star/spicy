<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order Tracking - SAVOR</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#1e1b17",
                        "surface-container": "#f4ece6",
                        "secondary-fixed-dim": "#c8c6c5",
                        "outline-variant": "#e0bfb8",
                        "inverse-primary": "#ffb4a5",
                        "on-tertiary-container": "#fefcf7",
                        "on-primary-fixed": "#3e0400",
                        "primary-fixed": "#ffdad3",
                        "on-tertiary-fixed": "#1b1c19",
                        "on-tertiary-fixed-variant": "#474744",
                        "secondary-fixed": "#e4e2e1",
                        "surface-container-highest": "#e9e1db",
                        "primary-container": "#cb4830",
                        "tertiary-fixed": "#e4e2dd",
                        "on-secondary-container": "#656464",
                        "inverse-on-surface": "#f7efe9",
                        "on-background": "#1e1b17",
                        "on-primary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "surface-tint": "#ad321c",
                        "surface-container-high": "#efe7e0",
                        "surface-container-low": "#faf2ec",
                        "tertiary-fixed-dim": "#c8c6c2",
                        "primary-fixed-dim": "#ffb4a5",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#59413c",
                        "outline": "#8d716b",
                        "on-secondary-fixed-variant": "#474747",
                        "on-secondary-fixed": "#1b1c1c",
                        "surface-variant": "#e9e1db",
                        "surface-bright": "#fff8f3",
                        "inverse-surface": "#33302c",
                        "surface": "#fff8f3",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#757571",
                        "on-primary-fixed-variant": "#8b1906",
                        "surface-dim": "#e0d9d2",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "background": "#fff8f3",
                        "on-error": "#ffffff",
                        "tertiary": "#5c5c58",
                        "primary": "#aa301a",
                        "secondary-container": "#e4e2e1",
                        "secondary": "#5f5e5e",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "md": "24px",
                        "sm": "12px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "xl": "64px",
                        "lg": "40px",
                        "margin-desktop": "120px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Playfair Display"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(170, 48, 26, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(170, 48, 26, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(170, 48, 26, 0); }
        }
        
        .map-gradient-overlay {
            background: linear-gradient(to top, var(--tw-colors-background) 0%, transparent 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md shadow-sm bg-tertiary/90 text-primary flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full">
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu</span>
</button>
<h1 class="font-display-lg text-headline-md tracking-widest text-primary">SAVOR</h1>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-primary p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
</button>
</header>
<main class="flex-grow flex flex-col md:flex-row max-w-[1280px] mx-auto w-full relative">
<!-- Map Canvas (Background on mobile, left pane on desktop) -->
<div class="h-[40vh] md:h-auto md:w-1/2 md:fixed md:left-0 md:top-16 md:bottom-0 bg-surface-container relative overflow-hidden">
<!-- Placeholder Map Image -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A detailed, clean, light-mode map interface of a dense urban city area, specifically styled in a premium minimalist aesthetic. The map utilizes a soft cream and beige color palette representing the 'Warm Cream' surface of the SAVOR design system. Roads are subtle white lines, parks are muted green, and water is a very pale soft blue. The overall mood is sophisticated, calm, and uncluttered, perfect for an upscale food delivery app background." data-location="New York City" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCzf0OuPagPyIsWoUm-OaGLqetOBoCWbffIKc5UnRbGLYzYuJ_0zubk8Dmas0rou2UFzfNbNRnKl0aHOr8DvcAyLHuDtyJXXEzxZH6qWbiRkRp04M751TgwuktFzHnluQRqL8hmTsGwPewNWCerXGhDhONA5G4vwmfo7D78PoVCTyuVXyDVhsfQ-I7-CG6v7oYMMkfxGbgW_EXBetXQEiFxVyiI7zWCgZWzHCkT_CrsOt-svr3VyAee')"></div>
<!-- Map Gradient for Mobile -->
<div class="absolute inset-0 map-gradient-overlay md:hidden bottom-0 h-32 mt-auto"></div>
<!-- Courier Pin (Simulated) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-primary text-on-primary rounded-full p-2 shadow-lg relative">
<span class="material-symbols-outlined text-label-md" style="font-variation-settings: 'FILL' 1;">two_wheeler</span>
<!-- Pulse effect behind pin -->
<div class="absolute inset-0 rounded-full bg-primary/20 pulse-ring -z-10"></div>
</div>
<div class="mt-2 bg-surface text-on-surface font-label-sm text-label-sm px-3 py-1 rounded-full shadow-sm border border-outline-variant/30">
                     Est. 15 min
                 </div>
</div>
</div>
<!-- Content Panel (Overlays map on mobile, right pane on desktop) -->
<div class="relative z-10 -mt-6 md:mt-0 md:ml-auto md:w-1/2 bg-background rounded-t-[2rem] md:rounded-none p-margin-mobile md:p-lg flex flex-col shadow-[0_-10px_30px_rgba(44,44,44,0.05)] md:shadow-none min-h-[60vh] md:min-h-0">
<div class="w-12 h-1.5 bg-surface-dim rounded-full mx-auto mb-6 md:hidden"></div>
<div class="flex flex-col space-y-md">
<!-- ETA Header -->
<div class="text-center md:text-left space-y-1">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Arriving in 15 mins</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your order from <span class="font-bold text-primary">SAVOR</span> is on the way.</p>
</div>
<!-- Order Details Card (Glassmorphism inspired) -->
<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant/20 shadow-sm mt-md relative overflow-hidden group hover:shadow-md transition-shadow duration-300">
<div class="absolute top-0 right-0 p-4 opacity-10">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="relative z-10 flex items-center justify-between">
<div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Order #8824</p>
<p class="font-body-md text-body-md text-on-surface font-medium">Truffle Risotto, Wagyu Tartare...</p>
</div>
<button class="text-primary hover:text-primary-container transition-colors p-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined">receipt_long</span>
</button>
</div>
</div>
<!-- Vertical Stepper -->
<div class="mt-xl pl-2 relative">
<!-- Continuous Line -->
<div class="absolute left-[15px] top-4 bottom-8 w-0.5 bg-surface-dim"></div>
<!-- Active Progress Line -->
<div class="absolute left-[15px] top-4 h-[40%] w-0.5 bg-primary"></div>
<ul class="space-y-lg relative z-10">
<!-- Step 1: Confirmed (Done) -->
<li class="flex items-start">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm border border-primary">
<span class="material-symbols-outlined text-on-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="ml-sm mt-1">
<h3 class="font-label-md text-label-md text-on-surface font-bold">Order Confirmed</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">12:45 PM</p>
</div>
</li>
<!-- Step 2: Preparing (Active) -->
<li class="flex items-start">
<div class="w-8 h-8 rounded-full bg-surface border-2 border-primary flex items-center justify-center shrink-0 relative">
<div class="w-2.5 h-2.5 rounded-full bg-primary pulse-ring"></div>
</div>
<div class="ml-sm mt-1">
<h3 class="font-label-md text-label-md text-primary font-bold">Preparing</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">The chef is plating your meal.</p>
</div>
</li>
<!-- Step 3: Out for Delivery (Pending) -->
<li class="flex items-start opacity-50">
<div class="w-8 h-8 rounded-full bg-surface border-2 border-surface-dim flex items-center justify-center shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-surface-dim"></div>
</div>
<div class="ml-sm mt-1">
<h3 class="font-label-md text-label-md text-on-surface font-medium">Out for Delivery</h3>
</div>
</li>
<!-- Step 4: Delivered (Pending) -->
<li class="flex items-start opacity-50">
<div class="w-8 h-8 rounded-full bg-surface border-2 border-surface-dim flex items-center justify-center shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-surface-dim"></div>
</div>
<div class="ml-sm mt-1">
<h3 class="font-label-md text-label-md text-on-surface font-medium">Delivered</h3>
</div>
</li>
</ul>
</div>
<!-- Spacer to push buttons down -->
<div class="flex-grow min-h-[40px]"></div>
<!-- Action Buttons -->
<div class="flex flex-col space-y-sm pt-lg mt-auto pb-safe">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-4 rounded-lg flex items-center justify-center space-x-2 transition-colors shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">call</span>
<span>Call Courier</span>
</button>
<button class="w-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-md text-label-md py-4 rounded-lg flex items-center justify-center space-x-2 transition-colors border border-outline-variant/30">
<span class="material-symbols-outlined">support_agent</span>
<span>Contact Support</span>
</button>
</div>
</div>
</div>
</main>
<!-- Hide Bottom Navigation on Desktop -->
<nav class="md:hidden fixed bottom-0 w-full z-50 backdrop-blur-md shadow-lg bg-tertiary/90 flex justify-around items-center h-20 px-4 pb-safe hidden">
<!-- Nav omitted structurally as it's a transactional page according to rules, but keeping the div structure hidden just in case to comply with negative constraints. Intent: Task-Focused tracking. Navigation shell suppressed. -->
</nav>
</body></html>
